global:
  scrape_interval: 2s # How often to fetch metrics

scrape_configs:
  # 1. Prometheus scraping its own health data
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Prometheus scraping Grafana's internal metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']